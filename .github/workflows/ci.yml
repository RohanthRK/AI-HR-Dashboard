name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pip-audit
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Run API tests (random scratch database on the service container)
        env:
          SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-hs256
        run: python run_tests.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependency audit
        run: npm audit
      - name: Unit tests
        run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-hs256
      MONGODB_URI: mongodb://localhost:27017/
      MONGODB_NAME: hr_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt playwright && playwright install --with-deps chromium
      - run: python e2e/seed.py
      - name: Start API
        run: |
          cd backend
          nohup python manage.py runserver 8765 --noreload > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8765/api/health/ && break; sleep 1; done
      - name: Build and serve the SPA
        run: |
          cd frontend && npm ci
          REACT_APP_API_URL=http://localhost:8765 BUILD_PATH=../e2e/build npm run build
          nohup python ../e2e/spa_server.py ../e2e/build > /dev/null 2>&1 &
          sleep 2
      - name: Browser flows
        run: python e2e/flows.py
      - name: Route sweep (desktop + phone, admin + employee)
        run: python e2e/sweep.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/screenshots
